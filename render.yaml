services:
  - type: web
    name: voicestudy-ai-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: HOST
        value: 0.0.0.0
      - key: QDRANT_STORAGE_PATH
        value: ./qdrant_data
      - key: LYZR_USER_ID
        value: default_student
      - key: LYZR_CHAT_URL
        value: https://agent-prod.studio.lyzr.ai/v3/inference/chat/
      - key: LYZR_API_KEY
        sync: false
      - key: LYZR_AGENT_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
