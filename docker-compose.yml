version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: voicestudy_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voicestudy_backend
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - LLM_API_KEY=${LLM_API_KEY}
      - LYZR_API_KEY=${LYZR_API_KEY}
      - OMI_API_KEY=${OMI_API_KEY}
    depends_on:
      - qdrant

volumes:
  qdrant_data:
